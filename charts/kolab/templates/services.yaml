# Kolab Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kolab.fullname" . }}-kolab
  labels:
    {{- include "kolab.labels" . | nindent 4 }}
    app.kubernetes.io/component: kolab
spec:
  type: {{ .Values.kolab.service.type }}
  ports:
    - port: {{ .Values.kolab.service.port }}
      targetPort: kolab
      protocol: TCP
      name: http
  selector:
    {{- include "kolab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kolab

{{- if .Values.postgresql.enabled }}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kolab.fullname" . }}-postgresql
  labels:
    {{- include "kolab.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "kolab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
